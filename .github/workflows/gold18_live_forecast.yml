name: Gold18 Live XGBoost Forecast

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forecast:
    name: Live Gold18 forecast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install forecasting stack
        run: |
          python -m pip install -U pip
          python -m pip install 'xgboost>=3.2,<4' numpy pandas requests
      - name: Fetch latest data and forecast
        env:
          OMP_NUM_THREADS: '4'
        run: python forecast_xgboost_live.py
      - name: Upload forecast
        uses: actions/upload-artifact@v4
        with:
          name: gold18-live-forecast
          path: |
            latest_xgboost_forecast.csv
            gold18_forecast_report.html
          retention-days: 30
