name: Gold18 Multivariate Frontier Benchmark v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timesfm:
    name: TimesFM-3 CPU benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h
      - name: Install official TimesFM 3 stack
        run: |
          python -m pip install -U pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy pandas requests pyarrow huggingface_hub
          git clone --depth 1 https://github.com/google-research/timesfm.git timesfm-src
          python -m pip install -e './timesfm-src[torch]'
          git -C timesfm-src rev-parse HEAD | tee timesfm_commit.txt
      - name: Run TimesFM-3
        id: run
        continue-on-error: true
        env:
          HF_HOME: ${{ runner.temp }}/hf
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: python run_model.py --model timesfm
      - name: Upload TimesFM result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-timesfm
          path: outputs/timesfm
          retention-days: 2

  chronos:
    name: Chronos-2 CPU benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Chronos-2 stack
        run: |
          python -m pip install -U pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install chronos-forecasting pandas pyarrow requests
      - name: Run Chronos-2
        continue-on-error: true
        env:
          HF_HOME: ${{ runner.temp }}/hf
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: python run_model.py --model chronos
      - name: Upload Chronos result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-chronos
          path: outputs/chronos
          retention-days: 2

  moirai:
    name: Moirai-2.0 CPU benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h
      - name: Install official Moirai 2.0 stack
        run: |
          python -m pip install -U pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          git clone --depth 1 https://github.com/SalesforceAIResearch/uni2ts.git uni2ts-src
          python -m pip install -e './uni2ts-src[notebook]'
          python -m pip install pandas requests
          git -C uni2ts-src rev-parse HEAD | tee moirai_commit.txt
      - name: Run Moirai-2.0
        continue-on-error: true
        env:
          HF_HOME: ${{ runner.temp }}/hf
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: python run_model.py --model moirai
      - name: Upload Moirai result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-moirai
          path: outputs/moirai
          retention-days: 2

  xgboost:
    name: XGBoost quantile benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install XGBoost stack
        run: |
          python -m pip install -U pip
          python -m pip install 'xgboost>=3.2,<4' numpy pandas requests
      - name: Run XGBoost
        continue-on-error: true
        env:
          OMP_NUM_THREADS: '4'
        run: python run_model.py --model xgboost
      - name: Upload XGBoost result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-xgboost
          path: outputs/xgboost
          retention-days: 2

  aggregate:
    name: Aggregate and rank models
    needs: [timesfm, chronos, moirai, xgboost]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas requests
      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: downloaded_artifacts
      - name: Build final report
        run: python aggregate.py
      - name: Upload final benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: gold18-frontier-final-results
          path: |
            final_results
            gold18_frontier_results.zip
          retention-days: 5
